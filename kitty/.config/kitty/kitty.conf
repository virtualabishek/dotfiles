# Kitty — managed with GNU Stow (dotfiles/kitty)
# Niri default terminal: Mod+Return (centered 1200x700), Mod+Shift+Return (full-width)

shell /usr/bin/fish --login --interactive
term xterm-256color
allow_remote_control yes
listen_on unix:/tmp/kitty
include themes/noctalia.conf

# — Scalable text — small scale —
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9.2
# tight line-height; keep ligatures
adjust_line_height 0
adjust_column_width 0
disable_ligatures never
# Devanagari (Nepali) — full range + Vedic/extensions, use Noto Sans/Serif as fallback
symbol_map U+0900-U+097F,U+1CD0-U+1CFF,U+A8E0-U+A8FF,U+11B00-U+11B5F Noto Sans Devanagari
draw_bold_text_with_bright_colors no
# let harfbuzz shape Devanagari correctly — don't thin artificially
# text_composition_strategy and thin_stroke removed for proper conjuncts

# — Window / padding — reduced top gap —
window_padding_width 6
single_window_margin_width -1
placement_strategy center
hide_window_decorations no
remember_window_size no
initial_window_width 120c
initial_window_height 30c
background_opacity 0.94
dynamic_background_opacity yes

# — Cursor —
cursor_shape block
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.1 0.4

# — Scrollback —
scrollback_lines 10000
scrollback_pager_history_size 0
wheel_scroll_multiplier 5.0

# — Tabs —
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{title}"

# — Misc —
enable_audio_bell no
visual_bell_duration 0.0
open_url_with default
copy_on_select no
strip_trailing_spaces smart

# — Colors are injected by Noctalia (themes/noctalia.conf) —
# Noctalia pushes Tokyo-Night here automatically; don't hardcode background/foreground above.

# — Keymap: ctrl+shift + =/- for scalable font (kitty native) —
map ctrl+shift+equal change_font_size all +0.5
map ctrl+shift+minus change_font_size all -0.5
map ctrl+shift+0 change_font_size all 0
map kitty_mod+w close_window
